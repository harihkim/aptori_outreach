[project]
name = "aptori-backend"
version = "0.1.0"
description = "Social intelligence and engagement copilot backend (headless core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
    "arq>=0.26",
    "pydantic-ai-slim[openai]>=2.37,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # httpx2 is Starlette TestClient's HTTP transport — the drop-in successor to
    # httpx — used implicitly by every test that builds TestClient(...). Dev-only;
    # nothing in app/ imports it. Future outbound HTTP in product code would also
    # use httpx2.
    "httpx2",
    "mypy",
    "ty",
    "pyrefly",
    "ruff>=0.16.5",
]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
# Keep the existing Callable/TypeVar spelling until the type-checker matrix
# adopts PEP 695 syntax consistently.
ignore = ["UP047"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.fastapi]
entrypoint = "app.main:app"
