name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APTORI_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aptori_outreach_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: backend
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy
      - run: uv run ty check app tests
      - run: uv run pyrefly check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # Reads the pinned pnpm version from packageManager (no root package.json).
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  obscura-retrieval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/obscura-retrieval
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Exact engines pin; the offline tests are hermetic.
          node-version: 20.18.0
          cache: npm
          cache-dependency-path: packages/obscura-retrieval/package-lock.json
      - run: npm ci
      - run: npm test

# The ADR-012 prototype smoke gate is deliberately NOT run here: it needs the
# pinned Obscura binary (SHA-256 verified), the WSL reference runtime, live
# network access, and a clean worktree. It stays on the reference machine via
# retrieval-eval/prototype-smoke/daily-smoke.sh.
